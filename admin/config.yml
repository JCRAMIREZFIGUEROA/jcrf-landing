backend:
  name: github
  repo: JCRAMIREZFIGUEROA/jcrf-landing
  branch: master
  # Sitio de un solo usuario -> no hace falta proxy OAuth (sveltia-cms-auth).
  # Al entrar a /admin/, Sveltia pide un Personal Access Token de GitHub
  # (Settings > Developer settings > Personal access tokens, permiso "repo").

# Modo simple: guardar = publicar directo (igual que en archivo.jcramirezfigueroa.com).
# No hay borradores ni paso extra de "Publish": lo que guardas queda en vivo al toque.

media_folder: "images/uploads"
public_folder: "/images/uploads"

# Optimizacion automatica de imagenes AL SUBIR (lo hace el navegador antes de
# guardar en GitHub). Evita que una captura de pantalla de 3 MB entre tal cual:
# se convierte a WebP, se achica a 1800 px de ancho como maximo y se comprime.
# Resultado tipico: ~100-250 KB por imagen. Esto mantiene el editor rapido y
# el repo liviano. Para volver atras, borra este bloque "media_libraries".
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1800
        svg:
          optimize: true

collections:
  - name: "posts"
    label: "Blog"
    label_singular: "Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titulo", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false }
      # required: false -> un post puede ser solo texto, solo galeria de fotos, o las dos cosas.
      - { label: "Contenido", name: "body", widget: "markdown", required: false }
      - label: "Galeria de imagenes (opcional)"
        name: "gallery"
        widget: "list"
        required: false
        label_singular: "Imagen"
        summary: "{{fields.image}}"
        hint: "Secuencia de fotos que se muestra DESPUES del texto. Arrastra para reordenar. Para una foto en medio del texto, usala dentro de Contenido."
        fields:
          - { label: "Imagen", name: "image", widget: "image" }
          - { label: "Texto alternativo (opcional)", name: "alt", widget: "string", required: false }

  - name: "publications"
    label: "Publicaciones"
    label_singular: "Publicacion"
    folder: "_publications"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titulo", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Medio / revista / conferencia", name: "venue", widget: "string" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - { label: "Articulo de revista", value: "manuscripts" }
          - { label: "Paper de conferencia", value: "conferences" }
          - { label: "Libro / capitulo", value: "books" }
      - label: "Link al paper (el titulo de la publicacion va a apuntar aqui)"
        name: "link"
        widget: "string"
        hint: "URL externa: arXiv, la pagina de la revista, un PDF alojado en otro lado, etc."
      - { label: "Resumen breve (opcional)", name: "excerpt", widget: "text", required: false }
      - { label: "Cita formal (opcional)", name: "citation", widget: "text", required: false }
      - { label: "Notas extra (opcional, no se muestran en el listado)", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Paginas"
    files:
      - label: "Portada"
        name: "about"
        file: "_pages/about.md"
        fields:
          - { label: "Titulo", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/" }
          - { label: "Author profile", name: "author_profile", widget: "hidden", default: true }
          - { label: "Redirect from", name: "redirect_from", widget: "hidden", required: false }
          - { label: "Mostrar el feed del blog debajo (portada = intro + blog en scroll)", name: "show_blog_feed", widget: "boolean", default: true }
          - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "site"
    label: "Titulo del sitio"
    files:
      - label: "General"
        name: "site"
        file: "_data/site.yml"
        fields:
          - { label: "Titulo / nombre del sitio", name: "title", widget: "string" }
          - { label: "Descripcion corta", name: "description", widget: "string" }

  - name: "author"
    label: "Autor / Contacto"
    files:
      - label: "Datos del autor"
        name: "jcrf"
        file: "_data/authors.yml"
        fields:
          - label: "jcrf"
            name: "jcrf"
            widget: "object"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Foto (archivo en /images/)", name: "avatar", widget: "string" }
              - { label: "Pronombres", name: "pronouns", widget: "string", required: false }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Ubicacion", name: "location", widget: "string", required: false }
              - { label: "Rol / institucion", name: "employer", widget: "string", required: false }
              - { label: "Sitio web (URL)", name: "uri", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "GitHub (usuario)", name: "github", widget: "string", required: false }
              - { label: "LinkedIn (usuario)", name: "linkedin", widget: "string", required: false }
              - { label: "Twitter/X (usuario)", name: "twitter", widget: "string", required: false }
              - { label: "Bluesky (usuario)", name: "bluesky", widget: "string", required: false }
              - { label: "Google Scholar (URL)", name: "googlescholar", widget: "string", required: false }
              - { label: "ORCID (URL)", name: "orcid", widget: "string", required: false }
              - { label: "ResearchGate (URL)", name: "researchgate", widget: "string", required: false }

  - name: "navigation"
    label: "Secciones del menu"
    files:
      - label: "Menu principal"
        name: "navigation"
        file: "_data/navigation.yml"
        fields:
          - label: "Enlaces"
            name: "main"
            widget: "list"
            fields:
              - { label: "Titulo", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
