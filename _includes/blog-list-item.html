{% include base_path %}
{% if post.id %}
  {% assign title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}
{% else %}
  {% assign title = post.title %}
{% endif %}
<p style="margin: 0 0 0.4em; line-height: 1.5;">
  <span style="color: var(--global-text-color-light);">{{ post.date | date: "%d/%m/%Y" }}:</span>
  <a href="{{ base_path }}{{ post.url }}" style="font-weight: bold;">{{ title }}</a>
</p>
